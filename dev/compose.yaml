name: websystem-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # 公式の minio イメージ（Docker Hub・quay.io）は匿名で取得できなくなったため chainguard を使う。MINIO_IMAGE で差し替え可
    image: ${MINIO_IMAGE:-chainguard/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpitdata:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 個人情報 DB（学生証の暗号文）。本体 DB とは別コンテナ・別ネットワーク（ys-piinet）。ホストにはループバックだけ公開する。
  # このコンテナは default ネットワークに接続しない（apps/api のコンテナから届かない）。
  pii-db:
    image: postgres:16-alpine
    container_name: ys-pii-db
    environment:
      # 開発専用のダミー値
      POSTGRES_USER: pii_owner
      POSTGRES_PASSWORD: pii_owner
      POSTGRES_DB: pii
      PII_ADMIN_PASSWORD: pii_admin
      PII_INGEST_PASSWORD: pii_ingest
    ports:
      - "127.0.0.1:54321:5432"
    networks:
      - piinet
    volumes:
      - piidata:/var/lib/postgresql/data
      - ./pii-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pii_owner -d pii"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  piinet:
    name: ys-piinet

volumes:
  pgdata:
  piidata:
  miniodata:
  mailpitdata:
